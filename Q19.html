<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <style>
        body {
            margin: 0;
            background-color: #e3f2fd;
        }

        h2 {
            margin: 0;
            padding: 15px;
            background-color: black;
            color: white;
            text-align: center;
            font-family:'Times New Roman', Times, serif;
            text-decoration: underline;
        }
        .gallery {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .gallery img {
            width: 23%;
            height: 165px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 2px 3px 6px gray;
        }

        @media (max-width: 900px) {

            .gallery img {
                width: 30%;
            }

        }
        @media (max-width: 600px) {

            .gallery {
                flex-direction: column;
                align-items: center;
            }

            .gallery img {
                width: 85%;
                height: 200px;
            }

        }

    </style>
</head>

<body>

    <h2>Image Gallery</h2>

    <div class="gallery">

        <img src="https://wallpaperaccess.com/full/9409729.jpg"
             alt="">

        <img src="https://www.indiatravel.app/wp-content/uploads/2024/03/places-to-visit-in-konkan.jpg"
             alt="">

        <img src="https://wallpaperaccess.com/full/9409716.jpg"
             alt="">

        <img src="https://images.travelandleisureasia.com/wp-content/uploads/sites/2/2023/03/07193856/IMG_20201106_172935-1.jpg"
             alt="">

        <img src="https://www.mypunepulse.com/wp-content/uploads/2025/06/Devgad-Fort.jpg"
             alt="">

        <img src="https://assets.traveltriangle.com/blog/wp-content/uploads/2018/01/FotoJet6592thfyg1.jpg"
             alt="">

        <img src="https://www.indiatravel.app/wp-content/uploads/2024/03/Alibaug-Fort-1024x585.jpg"
             alt="">

        <img src="https://1.bp.blogspot.com/-iBAsAuQifjY/WBn-yURK5OI/AAAAAAAAG4E/XvZLZ4Q4BEI4qnOu_EcoqpIh2eBnCSOnACLcB/s1600/ganpatipule1.jpg"
             alt="">

    </div>

</body>
</html>
