<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>

        body {
            margin: 0;
            background-color: #d6b1ef;
        }

        h1 {
            text-align: center;
            background-color: #414445;
            color: rgb(248, 247, 249);
            padding: 20px;
            margin: 0;
        }

        .container {
            height: 500px;
            margin: 40px;
            padding: 30px;
            background-color: #f5b6e5;
            display: flex;
            justify-content: space-around;
            align-items: center;

        }
        .box {
            width: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
        }

        .box1 {
            height: 150px;
            background-color: #2528eb;
        }

        .box2 {
            height: 250px;
            background-color: #21a359;
        }

        .box3 {
            height: 200px;
            background-color: #9daf27;
        }
        @media (max-width: 600px) {

            .container {
                height: auto;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 30px;
            }
            .box1{
                background-color: blueviolet;
            }
            .box2{
                background-color: brown;
            }
            .box3{
                background-color: rgb(227, 76, 38);
            }
            
        }

    </style>
</head>
<body>
    <h1>Flexbox Alignment</h1>
    <div class="container">
        <div class="box box1">
            Box 1
        </div>
        <div class="box box2">
            Box 2
        </div>
        <div class="box box3">
            Box 3
        </div>

    </div>

</body>
</html>
