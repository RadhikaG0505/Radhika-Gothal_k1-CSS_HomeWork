<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Page</title>

    <style>
        body {
            margin: 0;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            object-fit: cover;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.5);
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 700px;
            padding: 35px;
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.45);
            border-radius: 15px;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 50px;
            margin: 0 0 15px;
        }
        p {
            font-size: 19px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .content {
                width: 90%;
                padding: 25px;
            }
            h1 {
                font-size: 32px;
            }
            p {
                font-size: 15px;
            }

        }

    </style>
</head>

<body>

    <div class="video-container">
        <video autoplay muted loop>
            <source src=""C:\Users\vaibh\Downloads\1208094-hd_1920_1080_30fps (2).mp4 type="video/mp4">
            Your browser does not support video.
        </video>
        <div class="overlay"></div>
        <div class="content">

            <h1>Welcome to CafeEat</h1>

            <p>
                Enjoy freshly brewed coffee, delicious food,
                and a peaceful atmosphere. Your perfect cafe
                experience starts here.
            </p>

        </div>

    </div>

</body>
</html>
