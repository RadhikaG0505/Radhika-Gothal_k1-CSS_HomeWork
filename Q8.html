<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        body {
            margin: 0;
            background-color: #88e1b5;
        }
        .banner {
            position: relative;
            width: 100%;
            height: 600px;
            background-image: url("https://www.indiatravel.app/wp-content/uploads/2024/03/places-to-visit-in-konkan.jpg");
            background-size: cover;
            background-position: center;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            width: 400px;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.65);
            color: white;
            border-radius: 10px;
        }
        .content h1 {
            font-size: 40px;
        }
        .content p {
            font-size: 18px;
            font-style: italic;
        }
        .content button {
            padding: 12px 25px;
            background-color: #ff7a00;
            color: white;
            border-radius: 5px;
        }
        .fixed-box {
            position: fixed;
            right: 20px;
            bottom: 20px;
            padding: 15px 20px;
            background-color: #5a3825;
            color: white;
            border-radius: 25px;
            box-shadow: 0 4px 10px gray;
        }
    </style>
</head>
<body>

    <div class="banner">

        <div class="content">
            <h1>Explore Konkan</h1>

            <p>
                Discover beautiful beaches, green hills,
                waterfalls and delicious coastal food.
            </p>

            <button>Explore Now</button>
        </div>

    </div>
    <div class="fixed-box">
         Visit Our Tours and Travels..
    </div>

</body>
</html>
