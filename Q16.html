<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #d6a7ef;
            color: #333;
        }
        nav{
            background-color: black;
            padding:20px;
            display:flex;
            justify-content: space-evenly;
        }
        a{
            color:white;
            text-decoration: none;
        }
        .container {
            padding: 30px;
        }
        .profile {
            background-color: white;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            border-radius: 10px;
            box-shadow: 0 3px 8px #ccc;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #3498db;
        }

        .profile h1 {
            margin: 0 0 10px;
            color: #2c3e50;
        }

        .profile p {
            margin: 5px 0;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 180px;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 8px #ccc;
        }

        .card h2 {
            color: #3498db;
        }

        .card p {
            font-size: 18px;
            font-weight: bold;
        }
        @media (max-width: 900px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .cards {
                flex-wrap: wrap;
            }

            .card {
                flex: 40%;
            }
        }
        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .profile {
                flex-direction: column;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .cards {
                flex-direction: column;
            }

            .card {
                width: auto;
            }
        }
    </style>
</head>
<body>
    
 <nav>
   <a href="">Home</a> 
   <a href="">Prifle</a>
   <a href="">Courses</a>
   <a href="">Register</a>
   <a href="">Login</a>
   </nav>

    <div class="container">
        <div class="profile">

            <img src="https://static.vecteezy.com/system/resources/previews/014/194/215/original/avatar-icon-human-a-person-s-badge-social-media-profile-symbol-the-symbol-of-a-person-vector.jpg" alt="">

            <div>
                <h1>Radhika Gothal</h1>
                <p><b>Course:</b> B.Tech Computer Science</p>
                <p><b>Year:</b>Final Year</p>
                <p><b>Email:</b> radhika@gmail.com</p>
            </div>

        </div>
        <div class="cards">

            <div class="card">
                <h2>📚 Courses</h2>
                <p>6</p>
                <span>Enrolled Courses</span>
            </div>

            <div class="card">
                <h2>📊 Attendance</h2>
                <p>95%</p>
                <span>Overall Attendance</span>
            </div>

            <div class="card">
                <h2>📝 Assignments</h2>
                <p>1</p>
                <span>Pending Assignments</span>
            </div>

            <div class="card">
                <h2>🏆 CGPA</h2>
                <p>9.06</p>
                <span>Current CGPA</span>
            </div>

        </div>

    </div>

</body>
</html>
