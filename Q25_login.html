<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CafeEat - Login</title>

    <style>

        body {
            margin: 0;
            min-height: 700px;

            background-color: #f5e6d3;

            background-image:
                linear-gradient(rgba(75, 36, 18, 0.35),
                rgba(75, 36, 18, 0.35)),
                url("https://static.vecteezy.com/system/resources/previews/056/163/857/non_2x/modern-cafe-interior-design-featuring-yellow-and-grey-furniture-plants-and-large-windows-photo.jpg");

            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;
        }


        /* Login Box */

        .login-container {

            width: 360px;

            padding: 35px;

            margin-top: 80px;

            background-color: rgba(245, 230, 211, 0.95);

            border: 2px solid #6b3e26;

            border-radius: 12px;

            box-shadow: 0 8px 20px rgba(75, 36, 18, 0.5);

            text-align: center;

            transition: 0.4s;
        }


        /* Hover effect */

        .login-container:hover {

            transform: translateY(-5px);

            box-shadow: 0 12px 28px rgba(75, 36, 18, 0.6);
        }


        /* Heading */

        h1 {

            margin: 0 0 8px;

            font-family: Georgia, serif;

            font-size: 32px;

            color: #4b2412;

            text-transform: uppercase;

            text-decoration: underline;
        }


        /* CafeEat text */

        .subtitle {

            color: #6b3e26;

            font-size: 15px;

            font-style: italic;

            margin-bottom: 20px;
        }


        /* Labels */

        label {

            display: block;

            margin: 15px 0 6px;

            text-align: left;

            font-size: 15px;

            font-weight: bold;

            color: #4b2412;
        }
        input {

            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #9b6a4b;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            background-color: white;
            outline: none;
            transition: 0.3s;
        }
        input:hover {

            border-color: #6b3e26;

            background-color: #fffaf5;
        }
        input:focus {
            border: 2px solid #6b3e26;
            box-shadow: 0 0 6px rgba(107, 62, 38, 0.4);
            transform: scale(1.02);
        }
        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #6b3e26;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background-color: #4b2412;
            transform: scale(1.05);
            box-shadow: 0 5px 10px rgba(75, 36, 18, 0.4);
        }
        .login-btn:active {

            transform: scale(0.98);
        }
        @media (max-width: 600px) {

            body {

                background-image:
                    linear-gradient(rgba(75, 36, 18, 0.35),
                    rgba(75, 36, 18, 0.35)),
                    url("https://static.vecteezy.com/system/resources/thumbnails/021/701/769/small_2x/wooden-table-top-in-cafe-blurred-bokeh-background-ai-generated-image-photo.jpg");

                padding: 15px;
            }

            .login-container {

                width: 90%;

                padding: 25px;

                border-radius: 8px;

                margin-top: 40px;
            }
            h1 {

                font-size: 26px;
            }

            input {

                padding: 10px;
            }

            .login-btn {

                padding: 10px;
            }
        }

        @media screen and (orientation: landscape)
        and (max-width: 800px) {

            body {

                min-height: 600px;
            }

            .login-container {

                margin-top: 20px;

                padding: 20px;
            }
        }

        @media (prefers-color-scheme: dark) {

            body {

                background-color: #24150f;
            }


            .login-container {

                background-color: rgba(60, 35, 23, 0.96);

                border-color: #9b6a4b;
            }


            h1 {

                color: #f5d7b5;
            }


            .subtitle {

                color: #d8b18d;
            }


            label {

                color: #f5d7b5;
            }


            input {

                background-color: #f8f1eb;

                color: #333;
            }


            .login-btn {

                background-color: #8b5435;
            }


            .login-btn:hover {

                background-color: #5a2d18;
            }
        }

    </style>
</head>


<body>

    <div class="login-container">

        <h1>CafeEat</h1>
        <form action="Q25_home.html">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
            >
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

    </div>

</body>

</html>
