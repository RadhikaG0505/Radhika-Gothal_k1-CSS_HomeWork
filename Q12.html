<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        body {
            margin: 0;
            background-color: lightgray;
        }

        .container {
            text-align: center;
            padding: 200px 20px;
        }

        h1 {
            font-size: 40px;
            color: #333;
        }

        p {
            font-size: 20px;
        }
        @media (min-width: 601px) and (max-width: 1000px) {
            body {
                background-color: lightgreen;
            }

            h1 {
                color: darkgreen;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello</h1>
    </div>
</body>
</html>
