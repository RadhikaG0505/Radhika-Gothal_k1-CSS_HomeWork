<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Destination Banner</title>

    <style>
      
        body {
            margin: 0;
          
        }
        .banner {
            position: relative;
            width: 100%;
            height:500px;
            background-image: url("https://www.indiatravel.app/wp-content/uploads/2024/03/places-to-visit-in-konkan.jpg=");
            background-size: cover;
            background-position: center;
        }

        
        .content {
            position: absolute;
            top: 80px;
            left: 80px;
            color: white;
            width: 400px;
        }

       
        .content h1 {
            font-size: 55px;
            margin: 0 0 15px;
            font-style: italic

        }

        
        .content p {
            font-size: 18px;
            margin-bottom: 25px;
            font-style: italic;
        }

     
        .content button {
            background-color: rgb(244, 179, 60);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
           
        }

        .content button:hover {
            background-color: orange;
        }
    </style>
</head>

<body>

    <div class="banner">

        <div class="content">
            <h1>Konkan</h1>

            <p>
               <p>
    Discover the breathtaking beauty of Konkan, where pristine beaches,
    lush green hills, scenic waterfalls, rich culture, and delicious
    coastal cuisine come together to create an unforgettable experience.
</p>
            </p>

            <button>Explore Now</button>
        </div>

    </div>

</body>
</html>
