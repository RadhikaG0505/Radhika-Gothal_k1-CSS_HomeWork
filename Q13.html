<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background-color: lightgray;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

        @media (min-height: 501px) {

            body {
                background-color: lightblue;
            }

            h1 {
                font-size: 40px;
            }

            p {
                font-size: 18px;
            }
        }
        @media (max-height: 801px) {

            body {
                background-color: lightgreen;
            }

            .container {
                justify-content: center;
            }

            h1 {
                font-size: 55px;
            }

            p {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Welcome to My Website</h1>
        <p>
            The design changes according to screen height.
        </p>
        <p>
            Resize the browser vertically to see the changes.
        </p>

    </div>

</body>
</html>
